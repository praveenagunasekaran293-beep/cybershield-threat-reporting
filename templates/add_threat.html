<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Threat - CyberShield</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('dashboard') }}">
            🛡️ CyberShield
        </a>

        <div>
            <a href="{{ url_for('dashboard') }}"
               class="btn btn-outline-light btn-sm me-2">
                Dashboard
            </a>

            <a href="{{ url_for('threats') }}"
               class="btn btn-outline-light btn-sm me-2">
                Threat Reports
            </a>

            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-light btn-sm">
                Logout
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-2">
                        Add New Threat Report
                    </h2>

                    <p class="text-muted mb-4">
                        Enter the details of the cybersecurity threat.
                    </p>


                    <form method="POST">

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Threat Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Example: Phishing Email Attack"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe the cybersecurity threat..."
                                required
                            ></textarea>

                        </div>


                        <!-- Threat Type -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Threat Type
                            </label>

                            <select
                                name="threat_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Threat Type
                                </option>

                                <option value="Phishing">
                                    Phishing
                                </option>

                                <option value="Malware">
                                    Malware
                                </option>

                                <option value="Ransomware">
                                    Ransomware
                                </option>

                                <option value="SQL Injection">
                                    SQL Injection
                                </option>

                                <option value="DDoS">
                                    DDoS Attack
                                </option>

                                <option value="Brute Force">
                                    Brute Force
                                </option>

                                <option value="Data Breach">
                                    Data Breach
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="row">

                            <!-- Severity -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Severity
                                </label>

                                <select
                                    name="severity"
                                    class="form-select"
                                    required
                                >

                                    <option value="Low">
                                        Low
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                    <option value="Critical">
                                        Critical
                                    </option>

                                </select>

                            </div>


                            <!-- Status -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                    required
                                >

                                    <option value="Open">
                                        Open
                                    </option>

                                    <option value="Investigating">
                                        Investigating
                                    </option>

                                    <option value="Resolved">
                                        Resolved
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- Source -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Source
                            </label>

                            <input
                                type="text"
                                name="source"
                                class="form-control"
                                placeholder="Example: Email / Website / Security Tool"
                            >

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-dark px-4">
                                Submit Threat Report
                            </button>

                            <a
                                href="{{ url_for('threats') }}"
                                class="btn btn-outline-secondary px-4">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
